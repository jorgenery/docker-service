version: "3.8"

networks:
  public_net:
    external: true
  internal_net:
    external: true

services:
  # --- CUSTOM APPLICATIONS ---
  openclaw:
    image: alpine/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    environment:
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: ${OPENCLAW_DB_NAME:-openclaw}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      OLLAMA_URL: http://ollama:11434
      TZ: America/Sao_Paulo
    volumes:
      - ./data/openclaw:/app/data
      - ./data/openclaw_home:/home/node/.openclaw
    networks:
      - internal_net
    # Acesso apenas interno - OpenClaw não exposto via Traefik
