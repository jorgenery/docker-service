version: "3.8"

networks:
  public_net:
    external: true
  internal_net:
    external: true

services:
  # --- CUSTOM APPLICATIONS ---
  openclaw:
    image: alpine/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    environment:
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: ${OPENCLAW_DB_NAME:-openclaw}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      OLLAMA_URL: http://ollama:11434
      TZ: America/Sao_Paulo
    volumes:
      - ./data/openclaw:/app/data
    networks:
      - public_net
      - internal_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openclaw.rule=Host(`${OPENCLAW_HOST:-openclaw.exa\
        mple.com}`)"
      - "traefik.http.routers.openclaw.entrypoints=websecure"
      - "traefik.http.routers.openclaw.tls.certresolver=letsencrypt"
      - "traefik.http.services.openclaw.loadbalancer.server.port=3000"
    # ports removidas para segurança - acesso apenas via Traefik HTTPS
