version: "3.8"

# ========================================
# ORQUESTRAÇÃO PRINCIPAL DE CONTAINERS
# ========================================
# Este arquivo coordena todos os serviços
# Use: docker-compose -f docker-compose.yml -f core/docker-compose.yml -f database/docker-compose.yml ... up -d

networks:
  public_net:
    driver: bridge
    name: public_net
  internal_net:
    driver: bridge
    name: internal_net

